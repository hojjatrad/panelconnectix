name: Build Connectix Client Apps (Android & Windows) - ULTRA

on:
  workflow_dispatch:
    inputs:
      reseller_id:
        description: 'Reseller user ID for a branded APK build (empty = normal build only)'
        required: false
        default: ''
  push:
    branches:
      - main
      - ultra-dualcore-test
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs (Universal, ARM64, ARM32) - ULTRA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare Flutter Project - ULTRA Dual-Core
        run: |
          cd client-app
          echo "=== ULTRA Dual-Core Build - flutter_vless v4.0.19 FOREVER FIX ==="
          cat pubspec.yaml | grep -E "version|flutter_vless|flutter_v2ray"
          
          # Ensure release keystore exists
          if [ ! -f "android/app/release.keystore" ]; then
            echo "ERROR: release.keystore missing!"
            exit 1
          fi
          echo "Keystore present: $(ls -lh android/app/release.keystore)"
          
          # Ensure our custom MainActivity and Application exist
          mkdir -p android/app/src/main/kotlin/com/connectix/vpn
          mkdir -p android/app/src/main/res/xml
          if [ ! -f "android/app/src/main/res/xml/file_paths.xml" ]; then
            cat > android/app/src/main/res/xml/file_paths.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="."/>
              <cache-path name="cache" path="."/>
              <external-cache-path name="external_cache" path="."/>
              <external-files-path name="external_files2" path="."/>
              <files-path name="files" path="."/>
          </paths>
          EOF
          fi
          
          echo "Checking AndroidManifest..."
          cat android/app/src/main/AndroidManifest.xml | head -30
          
          flutter pub get
          flutter pub deps | grep vless || true
          echo "=== ULTRA preparation done ==="

      - name: Extract App Version
        id: version
        run: |
          APP_VER=$(grep -oE "currentAppVersion[[:space:]]*=[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+'" client-app/lib/screens/dashboard_screen.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "Detected App Version: $APP_VER"

      - name: Build Universal APK (All Androids)
        run: |
          cd client-app
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../Connectix-Universal.apk
          ls -lh ../Connectix-*.apk

      - name: Build Split-per-ABI APKs (ARM64 & ARM32)
        run: |
          cd client-app
          flutter build apk --split-per-abi --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../Connectix-ARM64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../Connectix-ARM32-v7a.apk 2>/dev/null || true
          ls -lh ../Connectix-*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-ULTRA-Android-APKs
          path: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk

      - name: Prepare Clean Release Asset Copies
        run: |
          cp Connectix-ARM64-v8a.apk Connectix-Android-ARM64.apk
          cp Connectix-Universal.apk Connectix-Android-Universal.apk
          cp Connectix-ARM32-v7a.apk Connectix-Android-ARM32.apk
          ls -lh Connectix-Android-*.apk

      - name: Generate app_release.json
        run: |
          python3 - << 'PY'
          import json, re, datetime, pathlib
          dart = open('client-app/lib/screens/dashboard_screen.dart', encoding='utf-8').read()
          ver = re.search(r"currentAppVersion\s*=\s*'([\d.]+)'", dart).group(1)
          pub = open('client-app/pubspec.yaml', encoding='utf-8').read()
          code = re.search(r"^version:\s*[\d.]+\+(\d+)", pub, re.M).group(1)
          changelog = 'ULTRA Dual-Core: flutter_vless with full protocol support (VLESS Reality/Vision, VMess, Trojan, SS, SOCKS, HTTP, WireGuard, Hysteria2, Raw JSON, Clash YAML, sing-box JSON)'
          base = f'https://github.com/hojjatrad/panelconnectix/releases/download/v{ver}'
          data = {
              'version': ver,
              'code': int(code),
              'changelog': changelog,
              'date': datetime.date.today().isoformat(),
              'apk': {
                  'arm64': base + '/Connectix-Android-ARM64.apk',
                  'universal': base + '/Connectix-Android-Universal.apk',
                  'arm32': base + '/Connectix-Android-ARM32.apk',
              },
              'ultra': True,
              'core': 'flutter_vless dual-core Xray+sing-box',
              'protocols': ['vless', 'vmess', 'trojan', 'ss', 'socks', 'http', 'wireguard', 'hysteria2', 'raw', 'clash', 'singbox']
          }
          with open('app_release.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('app_release.json =>', data['version'])
          PY

      - name: Upload Release Manifest
        uses: actions/upload-artifact@v4
        with:
          name: app-release-manifest
          path: app_release.json

  build-windows:
    name: Build Windows App (Xray core) - ULTRA
    runs-on: windows-latest
    needs: build-android
    if: false  # TEMP disabled: VS2019 generator missing on windows-latest, Android is priority for v4.0.19
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Extract App Version
        id: win_version
        shell: bash
        run: |
          APP_VER=$(grep -oE "currentAppVersion[[:space:]]*=[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+'" client-app/lib/screens/dashboard_screen.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "Detected App Version for Windows: $APP_VER"

      - name: Get dependencies
        working-directory: client-app
        run: flutter pub get

      - name: Download Xray core (Windows x64)
        shell: pwsh
        run: |
          $zip = "xray-windows-64.zip"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v25.3.6/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "xray" -Force
          Get-ChildItem "xray" | Select-Object Name

      - name: Build Windows release
        working-directory: client-app
        run: flutter build windows --release

      - name: Bundle Xray core
        shell: pwsh
        run: |
          $dest = "client-app\build\windows\x64\runner\Release\data\xray"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "xray\Xray.exe" "$dest\Xray.exe" -Force
          Get-ChildItem "$dest" | Select-Object Name,Length

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $rel = "client-app\build\windows\x64\runner\Release"
          Compress-Archive -Path "$rel\*" -DestinationPath "Connectix-Windows-x64.zip" -Force
          Get-Item "Connectix-Windows-x64.zip" | Select-Object Name,Length

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-ULTRA-Windows-App
          path: Connectix-Windows-x64.zip
