name: Build Connectix Client Apps (Android & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Prepare Flutter Project
        run: |
          cd client-app
          flutter create --org com.connectix.vpn --project-name connectix_vpn .
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/flutter.minSdkVersion/21/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle 2>/dev/null || true
          flutter pub get

      - name: Compile Release APK
        run: |
          cd client-app
          flutter build apk --release

      - name: Rename APK
        run: |
          cp client-app/build/app/outputs/flutter-apk/app-release.apk Connectix-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-Android-APK
          path: Connectix-Android.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: Connectix-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
