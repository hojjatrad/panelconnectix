name: Build Connectix Client Apps (Android & Windows)

on:
  workflow_dispatch:
    inputs:
      reseller_id:
        description: 'Reseller user ID for a branded APK build (empty = normal build only)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs (Universal, ARM64, ARM32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare Flutter Project & Generate Scaffolding
        run: |
          cd client-app
          flutter create --org com.connectix --project-name vpn .
          
          # Guarantee exact Kotlin MainActivity with correct package com.connectix.vpn
          rm -rf android/app/src/main/kotlin/*
          mkdir -p android/app/src/main/kotlin/com/connectix/vpn
          cat << 'EOF' > android/app/src/main/kotlin/com/connectix/vpn/MainActivity.kt
          package com.connectix.vpn

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.usage.UsageStatsManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.util.ArrayList
          import java.util.HashMap
          import java.util.HashSet

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.connectix.vpn/updater"
              private val NOTIF_CHANNEL_ID = "connectix_vpn_status_ch"
              private val V2RAY_CHANNEL_ID = "A_FLUTTER_V2RAY_SERVICE_CH_ID"
              private val NOTIF_ID = 1
              private var methodChannel: MethodChannel? = null

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  if (intent.action == "DISCONNECT_VPN_ACTION") {
                      try {
                          val notifMgr = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          notifMgr?.cancel(NOTIF_ID)
                          notifMgr?.cancel(9999)
                      } catch (_: Exception) {}
                      methodChannel?.invokeMethod("onNotificationDisconnect", null)
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel = channel

                  if (intent?.action == "DISCONNECT_VPN_ACTION") {
                      try {
                          val notifMgr = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                          notifMgr?.cancel(NOTIF_ID)
                          notifMgr?.cancel(9999)
                      } catch (_: Exception) {}
                      channel.invokeMethod("onNotificationDisconnect", null)
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      try {
                          if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 101)
                          }
                      } catch (_: Exception) {}
                  }

                  channel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "updateNotification" -> {
                              val title = call.argument<String>("title") ?: "Connectix VPN"
                              val content = call.argument<String>("content") ?: ""
                              val isConnected = call.argument<Boolean>("isConnected") ?: false
                              try {
                                  val notifMgr = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                                  if (notifMgr != null) {
                                      if (!isConnected) {
                                          notifMgr.cancel(NOTIF_ID)
                                          notifMgr.cancel(9999)
                                          result.success(true)
                                          return@setMethodCallHandler
                                      }

                                      var channelId = NOTIF_CHANNEL_ID
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                          if (notifMgr.getNotificationChannel(V2RAY_CHANNEL_ID) != null) {
                                              channelId = V2RAY_CHANNEL_ID
                                          } else {
                                              if (notifMgr.getNotificationChannel(NOTIF_CHANNEL_ID) == null) {
                                                  val ch = NotificationChannel(
                                                      NOTIF_CHANNEL_ID,
                                                      "Connectix VPN Status",
                                                      NotificationManager.IMPORTANCE_LOW
                                                  ).apply {
                                                      description = "نمایش زنده سرعت و وضعیت اتصال وی‌پی‌ان"
                                                      setShowBadge(false)
                                                      setSound(null, null)
                                                      enableVibration(false)
                                                  }
                                                  notifMgr.createNotificationChannel(ch)
                                              }
                                          }
                                      }

                                      val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                                      } else {
                                          PendingIntent.FLAG_UPDATE_CURRENT
                                      }

                                      val launchIntent = packageManager.getLaunchIntentForPackage(packageName)
                                      val contentPendingIntent = PendingIntent.getActivity(this, 100, launchIntent, flags)

                                      val discIntent = Intent(this, MainActivity::class.java).apply {
                                          action = "DISCONNECT_VPN_ACTION"
                                          this.flags = Intent.FLAG_ACTIVITY_SINGLE_TOP
                                      }
                                      val discPendingIntent = PendingIntent.getActivity(this, 101, discIntent, flags)

                                      val notif = NotificationCompat.Builder(this, channelId)
                                          .setSmallIcon(R.mipmap.ic_launcher)
                                          .setContentTitle(title)
                                          .setContentText(content)
                                          .setOngoing(true)
                                          .setOnlyAlertOnce(true)
                                          .setContentIntent(contentPendingIntent)
                                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "قطع اتصال", discPendingIntent)
                                          .setPriority(NotificationCompat.PRIORITY_LOW)
                                          .build()

                                      notifMgr.notify(NOTIF_ID, notif)
                                      notifMgr.cancel(9999)
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "cancelNotification" -> {
                              try {
                                  val notifMgr = getSystemService(Context.NOTIFICATION_SERVICE) as? NotificationManager
                                  notifMgr?.cancel(NOTIF_ID)
                                  notifMgr?.cancel(9999)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "getCacheDir" -> {
                              try {
                                  val extDir = context.getExternalFilesDir(null)
                                  val cacheDir = if (extDir != null && extDir.exists()) extDir else context.cacheDir
                                  if (!cacheDir.exists()) {
                                      cacheDir.mkdirs()
                                  }
                                  result.success(cacheDir.absolutePath)
                              } catch (e: Exception) {
                                  try {
                                      result.success(context.cacheDir.absolutePath)
                                  } catch (e2: Exception) {
                                      result.error("CACHE_DIR_ERROR", e.message, null)
                                  }
                              }
                          }
                          "canInstallPackages" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  result.success(context.packageManager.canRequestPackageInstalls())
                              } else {
                                  result.success(true)
                              }
                          }
                          "openInstallPermissionSettings" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  try {
                                      val intent = Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES)
                                      intent.data = Uri.parse("package:" + context.packageName)
                                      intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                      context.startActivity(intent)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.error("SETTINGS_ERROR", e.message, null)
                                  }
                              } else {
                                  result.success(true)
                              }
                          }
                          "openHotspotSettings" -> {
                              try {
                                  val intent = Intent(Intent.ACTION_MAIN)
                                  intent.setClassName("com.android.settings", "com.android.settings.TetherSettings")
                                  intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                  context.startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  try {
                                      val fallbackIntent = Intent(Settings.ACTION_WIRELESS_SETTINGS)
                                      fallbackIntent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                      context.startActivity(fallbackIntent)
                                      result.success(true)
                                  } catch (e2: Exception) {
                                      result.error("HOTSPOT_SETTINGS_ERROR", e2.message, null)
                                  }
                              }
                          }
                          "installApk" -> {
                              val filePath = call.argument<String>("filePath")
                              if (filePath != null) {
                                  val file = File(filePath)
                                  if (file.exists() && file.length() > 1000000) {
                                      try {
                                          val uri: Uri = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                              try {
                                                  FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
                                              } catch (e: Exception) {
                                                  val fallbackFile = File(context.getExternalFilesDir(null), "Connectix-Update.apk")
                                                  if (fallbackFile.exists()) {
                                                      FileProvider.getUriForFile(context, context.packageName + ".fileprovider", fallbackFile)
                                                  } else {
                                                      throw e
                                                  }
                                              }
                                          } else {
                                              Uri.fromFile(file)
                                          }
                                          val intent = Intent(Intent.ACTION_VIEW).apply {
                                              setDataAndType(uri, "application/vnd.android.package-archive")
                                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or 
                                                      Intent.FLAG_GRANT_READ_URI_PERMISSION or
                                                      Intent.FLAG_ACTIVITY_CLEAR_TOP
                                          }

                                          try {
                                              val resInfoList = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                                  packageManager.queryIntentActivities(intent, PackageManager.ResolveInfoFlags.of(PackageManager.MATCH_DEFAULT_ONLY.toLong()))
                                              } else {
                                                  @Suppress("DEPRECATION")
                                                  packageManager.queryIntentActivities(intent, PackageManager.MATCH_DEFAULT_ONLY)
                                              }
                                              for (resolveInfo in resInfoList) {
                                                  try {
                                                      val pkgName = resolveInfo.activityInfo.packageName
                                                      context.grantUriPermission(pkgName, uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                                  } catch (_: Exception) {}
                                              }
                                          } catch (_: Exception) {}

                                          context.startActivity(intent)
                                          result.success(true)
                                      } catch (e: Exception) {
                                          result.error("INSTALL_ERROR", e.message + " path=" + filePath + " len=" + file.length(), null)
                                      }
                                  } else {
                                      result.error("FILE_NOT_FOUND", "File does not exist or too small: $filePath len=${if (file.exists()) file.length() else 0}", null)
                                  }
                              } else {
                                  result.error("INVALID_ARGUMENT", "filePath is null", null)
                              }
                          }
                          "getLastCrashReport" -> {
                              try {
                                  val dir = context.getExternalFilesDir(null) ?: context.filesDir
                                  val file = File(dir, "connectix_last_crash.txt")
                                  result.success(if (file.exists()) file.readText() else "")
                              } catch (e: Exception) {
                                  result.success("")
                              }
                          }
                          "getInstalledBypassApps" -> {
                              try {
                                  val rawList = call.argument<List<*>>("packages") ?: emptyList<Any>()
                                  val candidateList = rawList.mapNotNull { it?.toString() }
                                  // v3.5.8 FIX: Filter to only installed packages
                                  val pm = context.packageManager
                                  val installed = ArrayList<String>()
                                  for (pkg in candidateList) {
                                      try {
                                          pm.getPackageInfo(pkg, 0)
                                          installed.add(pkg)
                                      } catch (_: Exception) {}
                                  }
                                  result.success(installed)
                              } catch (e: Exception) {
                                  result.success(emptyList<String>())
                              }
                          }
                          "getAllInstalledApps" -> {
                              Thread {
                                  try {
                                      val pm = context.packageManager
                                      val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                                          addCategory(Intent.CATEGORY_LAUNCHER)
                                      }
                                      val resolveInfos = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                          pm.queryIntentActivities(mainIntent, PackageManager.ResolveInfoFlags.of(PackageManager.MATCH_ALL.toLong()))
                                      } else {
                                          @Suppress("DEPRECATION")
                                          pm.queryIntentActivities(mainIntent, PackageManager.MATCH_ALL)
                                      }
                                      val appsList = ArrayList<Map<String, String>>()
                                      val selfPkg = context.packageName
                                      val seenPackages = HashSet<String>()

                                      for (ri in resolveInfos) {
                                          try {
                                              val pkg = ri.activityInfo?.packageName ?: continue
                                              if (pkg == selfPkg || seenPackages.contains(pkg)) continue
                                              seenPackages.add(pkg)

                                              val label = try {
                                                  ri.loadLabel(pm)?.toString() ?: pkg
                                              } catch (_: Exception) {
                                                  pkg
                                              }

                                              val map = HashMap<String, String>()
                                              map["packageName"] = pkg
                                              map["appName"] = label
                                              appsList.add(map)
                                          } catch (_: Exception) {
                                              continue
                                          }
                                      }

                                      appsList.sortBy { it["appName"]?.lowercase() ?: "" }

                                      runOnUiThread {
                                          try {
                                              result.success(appsList)
                                          } catch (_: Exception) {}
                                      }
                                  } catch (e: Exception) {
                                      runOnUiThread {
                                          try {
                                              result.error("GET_APPS_ERROR", e.message ?: "Unknown error", null)
                                          } catch (_: Exception) {}
                                      }
                                  }
                              }.start()
                          }
                          "checkUsageStatsPermission" -> {
                              try {
                                  val appOps = getSystemService(Context.APP_OPS_SERVICE) as android.app.AppOpsManager
                                  val mode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      appOps.unsafeCheckOpNoThrow("android:get_usage_stats", android.os.Process.myUid(), packageName)
                                  } else {
                                      @Suppress("DEPRECATION")
                                      appOps.checkOpNoThrow("android:get_usage_stats", android.os.Process.myUid(), packageName)
                                  }
                                  result.success(mode == android.app.AppOpsManager.MODE_ALLOWED)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "openUsageStatsSettings" -> {
                              try {
                                  val intent = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                                  intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                  startActivity(intent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  try {
                                      val intent = Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS)
                                      intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                      context.startActivity(intent)
                                      result.success(true)
                                  } catch (e2: Exception) {
                                      result.error("SETTINGS_ERROR", e2.message, null)
                                  }
                              }
                          }
                          "getForegroundApp" -> {
                              Thread {
                                  try {
                                      val usm = getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
                                      val end = System.currentTimeMillis()
                                      val begin = end - 1000 * 10
                                      val stats = usm.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, begin, end)
                                      var foregroundPkg: String? = null
                                      var lastTime: Long = 0
                                      if (stats != null) {
                                          for (s in stats) {
                                              try {
                                                  if (s.lastTimeUsed > lastTime) {
                                                      lastTime = s.lastTimeUsed
                                                      foregroundPkg = s.packageName
                                                  }
                                              } catch (_: Exception) {}
                                          }
                                      }
                                      if (foregroundPkg == null) {
                                          try {
                                              val events = usm.queryEvents(begin, end)
                                              val event = android.app.usage.UsageEvents.Event()
                                              var lastEventPkg: String? = null
                                              while (events.hasNextEvent()) {
                                                  events.getNextEvent(event)
                                                  if (event.eventType == android.app.usage.UsageEvents.Event.MOVE_TO_FOREGROUND) {
                                                      lastEventPkg = event.packageName
                                                  }
                                              }
                                              if (lastEventPkg != null) {
                                                  foregroundPkg = lastEventPkg
                                              }
                                          } catch (_: Exception) {}
                                      }

                                      val pkgToReturn = foregroundPkg ?: ""
                                      runOnUiThread {
                                          try {
                                              result.success(pkgToReturn)
                                          } catch (_: Exception) {}
                                      }
                                  } catch (e: Exception) {
                                      runOnUiThread {
                                          try {
                                              result.success("")
                                          } catch (_: Exception) {}
                                      }
                                  }
                              }.start()
                          }
                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }
          }
          EOF



          # Native crash capture: Application subclass (manifest android:name points to it)
          cat << 'EOF' > android/app/src/main/kotlin/com/connectix/vpn/ConnectixApplication.kt
          package com.connectix.vpn

          import android.app.Application
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class ConnectixApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  val defaultHandler = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, throwable ->
                      try {
                          writeCrashReport(thread, throwable)
                      } catch (_: Exception) {
                      }
                      if (defaultHandler != null) {
                          defaultHandler.uncaughtException(thread, throwable)
                      } else {
                          android.os.Process.killProcess(android.os.Process.myPid())
                          kotlin.system.exitProcess(10)
                      }
                  }
              }

              private fun writeCrashReport(thread: Thread, throwable: Throwable) {
                  try {
                      val dir = getExternalFilesDir(null) ?: filesDir
                      val file = File(dir, "connectix_last_crash.txt")
                      val time = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
                      val sb = StringBuilder()
                      sb.append("Time: ").append(time).append("\n")
                      sb.append("Thread: ").append(thread.name).append("\n")
                      sb.append("Device: ").append(android.os.Build.MANUFACTURER).append(" ")
                          .append(android.os.Build.MODEL).append(" (Android ")
                          .append(android.os.Build.VERSION.RELEASE).append(", API ")
                          .append(android.os.Build.VERSION.SDK_INT).append(")\n")
                      try {
                          val info = packageManager.getPackageInfo(packageName, 0)
                          sb.append("App: Connectix ").append(info.versionName ?: "unknown").append("\n")
                      } catch (_: Exception) {
                      }
                      sb.append("NativeCrash: unhandled exception (may be before Flutter first frame)\n\n")
                      var ex: Throwable? = throwable
                      var depth = 0
                      while (ex != null && depth < 4) {
                          sb.append("Exception").append(if (depth > 0) " (cause $depth)" else "")
                              .append(": ").append(ex.javaClass.name).append(": ").append(ex.message ?: "null").append("\n")
                          for (line in android.util.Log.getStackTraceString(ex).trim().lines().take(15)) {
                              sb.append(line).append("\n")
                          }
                          sb.append("\n")
                          ex = ex.cause
                          depth++
                      }
                      file.writeText(sb.toString())
                  } catch (_: Exception) {
                  }
              }
          }
          EOF

          # Configure FileProvider paths for direct in-place APK installation
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-cache-path name="external_cache_files" path="."/>
              <cache-path name="cache_files" path="."/>
              <files-path name="internal_files" path="."/>
              <external-files-path name="external_files" path="."/>
          </paths>
          EOF

          # Verify permanent Canonical Release Keystore (Ensures 100% matching signatures across all future releases for seamless in-place updates)
          if [ -f "android/app/release.keystore" ]; then
            echo "Permanent release keystore present: $(ls -l android/app/release.keystore)"
          else
            echo "CRITICAL: android/app/release.keystore missing from repository!"
            exit 1
          fi

          # Configure gradle.properties
          cat << 'EOF' >> android/gradle.properties
          android.bundle.enableUncompressedNativeLibs=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Configure build.gradle with minSdk 21, targetSdk 34, multiDex, and clean release signing
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.connectix.vpn"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.connectix.vpn"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = __VERSION_CODE__
                  versionName = "__VERSION_NAME__"
                  multiDexEnabled = true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'connectix123'
                      keyAlias 'connectix'
                      keyPassword 'connectix123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # Inject the real version: versionCode from pubspec build number,
          # versionName from the in-app version constant (dashboard_screen.dart),
          # so Android gets proper upgrade semantics instead of a frozen 3.0.0.
          PUB_CODE=$(grep -E '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          APP_VER=$(grep -oE "currentAppVersion[[:space:]]*=[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+'" lib/screens/dashboard_screen.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$PUB_CODE" ] || [ -z "$APP_VER" ]; then
            echo "ERROR: could not derive version (PUB_CODE='$PUB_CODE' APP_VER='$APP_VER')"
            exit 1
          fi
          BASE_VERSION_CODE=$((100000 + PUB_CODE))
          echo "Injecting versionCode=$BASE_VERSION_CODE (base from PUB_CODE=$PUB_CODE) versionName=$APP_VER"
          sed -i "s/__VERSION_CODE__/${BASE_VERSION_CODE}/; s/__VERSION_NAME__/${APP_VER}/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

          # Ensure AndroidManifest has extractNativeLibs, VPN permissions, package installer and launcher activity + queries for package visibility
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:mimeType="application/vnd.android.package-archive" />
                  </intent>
              </queries>
              
              <application
                  android:label="Connectix VPN"
                  android:name=".ConnectixApplication"
                  android:icon="@mipmap/ic_launcher"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true">
                  <provider android:name="androidx.startup.InitializationProvider"
                      tools:node="remove" />
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          flutter pub get

      - name: Extract App Version
        id: version
        run: |
          APP_VER=$(grep -oE "currentAppVersion[[:space:]]*=[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+'" client-app/lib/screens/dashboard_screen.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "Detected App Version: $APP_VER"

      - name: Build Universal APK (All Androids)
        run: |
          cd client-app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Connectix-Universal.apk

      - name: Build Split-per-ABI APKs (ARM64 & ARM32)
        run: |
          cd client-app
          flutter build apk --split-per-abi --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../Connectix-ARM64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../Connectix-ARM32-v7a.apk 2>/dev/null || true

      - name: Build Branded Reseller APK (optional, workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.reseller_id != ''
        env:
          PANEL_BRAND_KEY: ${{ secrets.PANEL_BRAND_KEY }}
        run: |
          set -e
          cd client-app
          curl -fsSL "https://vpbotn.ir/contax/index.php?route=api/v1/reseller/brand/${{ inputs.reseller_id }}&key=${PANEL_BRAND_KEY}" -o /tmp/brand.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/brand.json'))
          label = (d.get('data') or d).get('brand_name') or 'Connectix VPN'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = s.replace('android:label="Connectix VPN"', f'android:label="{label}"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Branded build label:', label)
          PY
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../Connectix-Branded-${{ inputs.reseller_id }}.apk"

      - name: Upload Branded APK Artifact
        if: github.event_name == 'workflow_dispatch' && inputs.reseller_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-Branded-APK
          path: Connectix-Branded-*.apk

      - name: Rigorous Automated APK Verification Test
        run: |
          python3 - << 'EOF'
          import zipfile, sys

          apks = ["Connectix-ARM64-v8a.apk", "Connectix-Universal.apk"]
          for apk in apks:
              print(f"--> Validating {apk}...")
              with zipfile.ZipFile(apk, "r") as z:
                  names = z.namelist()
                  dexes = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
                  if not dexes:
                      print(f"FAIL: no classes*.dex found in {apk}")
                      sys.exit(1)
                  all_dex = b"".join(z.read(n) for n in dexes)
                  
                  # Verify MainActivity exists in DEX
                  expected_class = b"Lcom/connectix/vpn/MainActivity;"
                  if expected_class not in all_dex:
                      print(f"CRITICAL TEST FAILED: {expected_class} NOT FOUND in dex of {apk}!")
                      sys.exit(1)
                  print(f"VERIFIED: {expected_class} found in {apk} dex!")
                  
                  # Verify ConnectixApplication exists in DEX
                  crash_app = b"Lcom/connectix/vpn/ConnectixApplication;"
                  if crash_app not in all_dex:
                      print(f"CRITICAL TEST FAILED: {crash_app} NOT FOUND in dex of {apk} (app would crash at startup)!")
                      sys.exit(1)
                  print(f"VERIFIED: {crash_app} found in {apk} dex!")

                  # Verify updateNotification method channel exists in DEX
                  if b"updateNotification" not in all_dex:
                      print(f"CRITICAL TEST FAILED: updateNotification NOT FOUND in dex of {apk}!")
                      sys.exit(1)
                  print(f"VERIFIED: updateNotification method channel found in {apk} dex!")

                  # CRITICAL INTEGRITY CHECK: NO phantom V2rayNotificationReceiver in manifest
                  manifest_bytes = z.read("AndroidManifest.xml")
                  utf16_strings = []
                  pos = 0
                  while pos < len(manifest_bytes) - 1:
                      end = pos
                      while end < len(manifest_bytes) - 1 and manifest_bytes[end+1] == 0 and 32 <= manifest_bytes[end] <= 126:
                          end += 2
                      if end - pos >= 8:
                          try:
                              s = manifest_bytes[pos:end].decode('utf-16le')
                              utf16_strings.append(s)
                          except:
                              pass
                          pos = end + 2
                      else:
                          pos += 1

                  for s in utf16_strings:
                      if "V2rayNotificationReceiver" in s:
                          print(f"CRITICAL DEFECT DETECTED: V2rayNotificationReceiver found in {apk} manifest!")
                          sys.exit(1)

                  print(f"SUCCESS: {apk} passed all structural, class, and integrity tests.")
          print("ALL APKS PASSED RIGOROUS AUTOMATED VERIFICATION TESTS!")
          EOF

      - name: Generate app_release.json (Auto-Publish Manifest for All Panels)
        run: |
          python3 - << 'PY'
          import json, re, datetime
          dart = open('client-app/lib/screens/dashboard_screen.dart', encoding='utf-8').read()
          ver = re.search(r"currentAppVersion\s*=\s*'([\d.]+)'", dart).group(1)
          pub = open('client-app/pubspec.yaml', encoding='utf-8').read()
          code = re.search(r"^version:\s*[\d.]+\+(\d+)", pub, re.M).group(1)
          changelog = ''
          try:
              cl = open('client-app/CHANGELOG.md', encoding='utf-8').read()
              m = re.search(r'## [\d.]+[^\n]*\n(.*?)(?=\n## |\Z)', cl, re.S)
              changelog = ' '.join(m.group(1).split()) if m else ''
          except FileNotFoundError:
              pass
          base = f'https://github.com/hojjatrad/panelconnectix/releases/download/v{ver}'
          data = {
              'version': ver,
              'code': int(code),
              'changelog': changelog,
              'date': datetime.date.today().isoformat(),
              'apk': {
                  'arm64': base + '/Connectix-Android-ARM64.apk',
                  'universal': base + '/Connectix-Android-Universal.apk',
                  'arm32': base + '/Connectix-Android-ARM32.apk',
              },
          }
          with open('app_release.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('app_release.json =>', data['version'])
          PY

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-Android-APKs
          path: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk
            app_release.json

      - name: Prepare Clean Release Asset Copies
        run: |
          cp Connectix-ARM64-v8a.apk Connectix-Android-ARM64.apk
          cp Connectix-Universal.apk Connectix-Android-Universal.apk
          cp Connectix-ARM32-v7a.apk Connectix-Android-ARM32.apk

      - name: Publish All APKs to GitHub Release v3.0.0 (Panel Sync)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: Connectix Client Release (Current Builds)
          files: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk
            Connectix-Android-ARM64.apk
            Connectix-Android-Universal.apk
            Connectix-Android-ARM32.apk
            app_release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_ver }}
          name: Connectix Client Release v${{ steps.version.outputs.app_ver }}
          draft: false
          prerelease: false
          files: |
            Connectix-Android-ARM64.apk
            Connectix-Android-Universal.apk
            Connectix-Android-ARM32.apk
            Connectix-ARM64-v8a.apk
            Connectix-Universal.apk
            app_release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ---------------------------------------------------------------------
  # Windows client (Phase 1): Flutter Windows runner + bundled open-source
  # Xray core + Windows system-proxy routing. See lib/services/xray_service.dart
  # ---------------------------------------------------------------------
  build-windows:
    name: Build Windows App (Xray core)
    runs-on: windows-latest
    needs: build-android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract App Version
        id: win_version
        shell: bash
        run: |
          APP_VER=$(grep -oE "currentAppVersion[[:space:]]*=[[:space:]]*'[0-9]+\.[0-9]+\.[0-9]+'" client-app/lib/screens/dashboard_screen.dart | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "app_ver=$APP_VER" >> $GITHUB_OUTPUT
          echo "Detected App Version for Windows: $APP_VER"

      - name: Get dependencies
        working-directory: client-app
        run: flutter pub get

      - name: Download pinned Xray core (Windows x64)
        shell: pwsh
        run: |
          $zip = "xray-windows-64.zip"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v25.3.6/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "xray" -Force
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun" -Force
          $wintunDll = Get-ChildItem -Path "wintun" -Recurse -Filter "wintun.dll" |
              Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $wintunDll) { throw "wintun.dll (amd64) not found in archive" }
          Copy-Item $wintunDll.FullName "xray\wintun.dll" -Force
          Write-Host "wintun.dll staged: $((Get-Item 'xray\wintun.dll').Length) bytes"
          Get-ChildItem "xray" | Select-Object Name

      - name: Build Windows release
        working-directory: client-app
        run: flutter build windows --release

      - name: Bundle Xray core into app data
        shell: pwsh
        run: |
          $dest = "client-app\build\windows\x64\runner\Release\data\xray"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "xray\Xray.exe" "$dest\Xray.exe" -Force
          if (Test-Path "xray\wintun.dll") { Copy-Item "xray\wintun.dll" "$dest\wintun.dll" -Force }
          else { Write-Host "WARNING: wintun.dll missing - TUN mode will not work" }
          if (-not (Test-Path "xray\geoip.dat")) { Write-Host "geoip.dat not present (ok for client)" }
          else { Copy-Item "xray\geoip.dat" "$dest\geoip.dat" -Force }
          if (-not (Test-Path "xray\geosite.dat")) { Write-Host "geosite.dat not present (ok for client)" }
          else { Copy-Item "xray\geosite.dat" "$dest\geosite.dat" -Force }
          Get-ChildItem "$dest" | Select-Object Name,Length

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $rel = "client-app\build\windows\x64\runner\Release"
          Compress-Archive -Path "$rel\*" -DestinationPath "Connectix-Windows-x64.zip" -Force
          Get-Item "Connectix-Windows-x64.zip" | Select-Object Name,Length

      - name: Generate app_release.json (with Windows section)
        shell: bash
        run: |
          python - <<'PY'
          import json, re, datetime, pathlib
          base_dir = pathlib.Path.cwd()
          dart = open('client-app/lib/screens/dashboard_screen.dart', encoding='utf-8').read()
          ver = re.search(r"currentAppVersion\s*=\s*'([\d.]+)'", dart).group(1)
          pub = open('client-app/pubspec.yaml', encoding='utf-8').read()
          code = re.search(r"^version:\s*[\d.]+\+(\d+)", pub, re.M).group(1)
          changelog = ''
          try:
              cl = open('client-app/CHANGELOG.md', encoding='utf-8').read()
              m = re.search(r'## [\d.]+[^\n]*\n(.*?)(?=\n## |\Z)', cl, re.S)
              changelog = ' '.join(m.group(1).split()) if m else ''
          except FileNotFoundError:
              pass
          base = f'https://github.com/hojjatrad/panelconnectix/releases/download/v{ver}'
          data = {
              'version': ver,
              'code': int(code),
              'changelog': changelog,
              'date': datetime.date.today().isoformat(),
              'apk': {
                  'arm64': base + '/Connectix-Android-ARM64.apk',
                  'universal': base + '/Connectix-Android-Universal.apk',
                  'arm32': base + '/Connectix-Android-ARM32.apk',
              },
              'windows': {
                  'version': ver,
                  'file': 'Connectix-Windows-x64.zip',
                  'url': base + '/Connectix-Windows-x64.zip',
                  'min_os': 'Windows 10 64-bit',
              },
          }
          with open('app_release.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('app_release.json (windows) =>', data['version'])
          PY

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-Windows-App
          path: Connectix-Windows-x64.zip

      - name: Publish Windows + final manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            Connectix-Windows-x64.zip
            app_release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Windows to Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.win_version.outputs.app_ver }}
          files: |
            Connectix-Windows-x64.zip
            app_release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
