name: Build Connectix Client Apps (Android & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs (Universal, ARM64, ARM32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Prepare Flutter Project & Generate Scaffolding
        run: |
          cd client-app
          flutter create --org com.connectix.vpn --project-name connectix_vpn .
          
          # Generate Production Release Keystore for Android 9+ v1/v2 Signing
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias connectix -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass connectix123 -keypass connectix123 \
            -dname "CN=Connectix VPN, OU=Client, O=Connectix, L=Tehran, ST=Tehran, C=IR"

          # Configure gradle.properties to prevent native lib compression issues
          cat << 'EOF' >> android/gradle.properties
          android.bundle.enableUncompressedNativeLibs=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Configure build.gradle with minSdk 21, targetSdk 34, multiDex, and useLegacyPackaging
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.connectix.vpn"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.connectix.vpn"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.0.1"
                  multiDexEnabled = true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'connectix123'
                      keyAlias 'connectix'
                      keyPassword 'connectix123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # Ensure AndroidManifest has extractNativeLibs="true", exported activities, and V2Ray VPN Service
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
              
              <application
                  android:label="Connectix VPN"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <!-- V2Ray Native VPN Services -->
                  <service
                      android:name="com.flutterv2ray.flutter_v2ray.v2ray.V2rayVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>
                  <service
                      android:name="com.flutterv2ray.flutter_v2ray.v2ray.V2rayProxyOnlyService"
                      android:exported="false"/>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          flutter pub get

      - name: Build Universal APK (All Androids)
        run: |
          cd client-app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Connectix-Universal.apk

      - name: Build Split-per-ABI APKs (ARM64 & ARM32)
        run: |
          cd client-app
          flutter build apk --split-per-abi --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../Connectix-ARM64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../Connectix-ARM32-v7a.apk 2>/dev/null || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-Android-APKs
          path: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk

      - name: Publish All APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
