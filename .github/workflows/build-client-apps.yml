name: Build Connectix Client Apps (Android & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs (Universal, ARM64, ARM32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare Flutter Project & Generate Scaffolding
        run: |
          cd client-app
          flutter create --org com.connectix --project-name vpn .
          
          # Guarantee exact Kotlin MainActivity with correct package com.connectix.vpn
          rm -rf android/app/src/main/kotlin/*
          mkdir -p android/app/src/main/kotlin/com/connectix/vpn
          cat << 'EOF' > android/app/src/main/kotlin/com/connectix/vpn/MainActivity.kt
          package com.connectix.vpn

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

          # Keep permanent Release Keystore for seamless updates over existing app without uninstalling
          if [ ! -f "android/app/release.keystore" ]; then
            keytool -genkey -v -keystore android/app/release.keystore \
              -alias connectix -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass connectix123 -keypass connectix123 \
              -dname "CN=Connectix VPN, OU=Client, O=Connectix, L=Tehran, ST=Tehran, C=IR"
          fi

          # Configure gradle.properties
          cat << 'EOF' >> android/gradle.properties
          android.bundle.enableUncompressedNativeLibs=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Configure build.gradle with minSdk 21, targetSdk 34, multiDex, and clean release signing
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.connectix.vpn"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }

              kotlinOptions {
                  jvmTarget = "1.8"
              }

              defaultConfig {
                  applicationId = "com.connectix.vpn"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 6
                  versionName = "3.0.0"
                  multiDexEnabled = true
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'connectix123'
                      keyAlias 'connectix'
                      keyPassword 'connectix123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }

          flutter {
              source = "../.."
          }

          dependencies {
              implementation 'androidx.multidex:multidex:2.0.1'
          }
          EOF

          # Ensure AndroidManifest has extractNativeLibs, VPN permissions and launcher activity
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              
              <application
                  android:label="Connectix VPN"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:extractNativeLibs="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          flutter pub get

      - name: Build Universal APK (All Androids)
        run: |
          cd client-app
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../Connectix-Universal.apk

      - name: Build Split-per-ABI APKs (ARM64 & ARM32)
        run: |
          cd client-app
          flutter build apk --split-per-abi --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../Connectix-ARM64-v8a.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../Connectix-ARM32-v7a.apk 2>/dev/null || true

      - name: Rigorous Automated APK Verification Test
        run: |
          python3 - << 'EOF'
          import zipfile, sys

          apks = ["Connectix-ARM64-v8a.apk", "Connectix-Universal.apk"]
          for apk in apks:
              print(f"--> Validating {apk}...")
              with zipfile.ZipFile(apk, "r") as z:
                  names = z.namelist()
                  if "classes.dex" not in names:
                      print(f"FAIL: classes.dex missing in {apk}")
                      sys.exit(1)
                  dex = z.read("classes.dex")
                  # Crucial check: verify that MainActivity exists in DEX
                  expected_class = b"Lcom/connectix/vpn/MainActivity;"
                  if expected_class not in dex:
                      print(f"CRITICAL TEST FAILED: {expected_class} NOT FOUND in classes.dex of {apk}!")
                      sys.exit(1)
                  print(f"VERIFIED: {expected_class} found in {apk} classes.dex!")
                  
                  # Verify AndroidManifest.xml exists
                  if "AndroidManifest.xml" not in names:
                      print(f"FAIL: AndroidManifest.xml missing in {apk}")
                      sys.exit(1)
                  print(f"SUCCESS: {apk} passed all structural and startup tests.")
          print("ALL APKS PASSED RIGOROUS AUTOMATED VERIFICATION TESTS!")
          EOF

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Connectix-Android-APKs
          path: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk

      - name: Publish All APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            Connectix-Universal.apk
            Connectix-ARM64-v8a.apk
            Connectix-ARM32-v7a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
